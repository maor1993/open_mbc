[package]
name = "open_mbc"
version = "0.1.0"
edition = "2021"
authors = ["Maor Malka <maor1993@outlook.com>"]
license = "GPL-3.0-or-later"
homepage = "https://youtu.be/dQw4w9WgXcQ"
description = "Open Multi band compressor"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib","lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = [
    "assert_process_allocs",
    "standalone"
] }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git"}

cute-dsp = { git = "https://github.com/CuteDSP/RSCuteDSP", features = ["std"] }
vizia = { version = "0.3.0"}
# vizia = { git = "https://github.com/robbert-vdh/vizia.git", default-features = false, features = [
#     "baseview",
# ] }
crossbeam = "0.8.4"
anyhow = "1.0.100"
atomic_float = "1.1.0"


[dev-dependencies]
plotters = {version = "0.3.7"}
wavers = "1.5.1"


[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
