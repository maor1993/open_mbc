[package]
name = "open_mbc"
version = "0.2.2"
edition = "2021"
authors = ["Maor Malka <maor1993@outlook.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/maor1993/open_mbc"
description = "Open Multi band compressor"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
anyhow = "1.0.100"
vergen-git2 = { version = "1.0.7", features = [
    "build",
    "cargo",
    "rustc",
    "si",
] }

[dependencies]
nice-plug = { version = "0.3.0", features = [
    "assert_process_allocs",
    "standalone",
] }
nice-plug-egui = { version = "0.4.0"}
cute-dsp = { git = "https://github.com/maor1993/RSCuteDSP.git", features = [
    "std",
] }
crossbeam = "0.8.4"
anyhow = "1.0.100"

egui_plot = { version = "0.37.0" }
num-complex = "0.4.6"
egui_knob = "0.6.1"
splines = "5.0.0"
egui_extras = { version = "0.36.1", features = ["svg"] }
pitchy = "0.2.0"
egui = "0.36.1"

[dev-dependencies]
plotters = { version = "0.3.7" }
wavers = "1.5.1"


[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
