name: Auto Bundle

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      matrix:
        include:
          - { name: ubuntu-22.04,    os: ubuntu-22.04,   cross-target: '' }
          - { name: macos-universal, os: macos-latest,   cross-target: x86_64-apple-darwin }
          - { name: windows,         os: windows-latest, cross-target: '' }
    name: Package plugin binaries
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch all git history
        run: git fetch --force --prune --tags --unshallow

      - name: Install dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # --- NEW: IMPORT MAC CERTIFICATE ---
      - name: Import Apple Certificate
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - uses: actions/cache@v4
        if: startsWith(matrix.os, 'windows')
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.name }}-${{ matrix.cross-target }}
          
      - uses: actions/cache@v4
        if: "!startsWith(matrix.os, 'windows')"
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.name }}-${{ matrix.cross-target }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.cross-target }}

      - name: Package all targets from bundler.toml
        run: |
          package_args=()
          for package in $(cargo xtask known-packages); do
            package_args+=("-p" "$package")
          done

          runner_name=${{ matrix.name }}
          if [[ $runner_name = 'macos-universal' ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13
            cargo xtask bundle-universal "${package_args[@]}" --release
          else
            cross_target=${{ matrix.cross-target }}
            if [[ -n $cross_target ]]; then
              package_args+=("--target" "$cross_target")
            fi
            cargo xtask bundle "${package_args[@]}" --release
          fi

      #  SIGN AND NOTARIZE MACOS BINARIES 
      - name: Sign and Notarize macOS Plugins
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
         # 1. Check if certificates were imported correctly
          echo "Checking available identities..."
          security find-identity -v -p codesigning
          
          # 2. Extract the Identity Name
          # We search specifically for the 'Developer ID Application' certificate
          CERT_ID=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F '"' '{print $2}')
          
          if [ -z "$CERT_ID" ]; then
            echo "ERROR: No valid 'Developer ID Application' certificate found in keychain."
            exit 1
          fi
          echo "Using Certificate ID: $CERT_ID"

          # 3. Verify the build exists
          if [ ! -d "target/bundled" ] || [ -z "$(ls -A target/bundled/*.vst3 2>/dev/null)" ]; then
            echo "ERROR: No .vst3 files found in target/bundled/"
            exit 1
          fi

          # 4. Sign and Notarize
          for plugin in target/bundled/*.vst3; do
            echo "Signing $plugin..."
            codesign --force --options runtime --timestamp --sign "$CERT_ID" --deep "$plugin"
            
            echo "Creating temp zip for $plugin..."
            zip_name="notarization_tmp.zip"
            ditto -c -k --keepParent "$plugin" "$zip_name"
            
            echo "Submitting to Apple Notary Service..."
            # Using --wait ensures the script stays alive until Apple finishes
            xcrun notarytool submit "$zip_name" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            
            echo "Stapling $plugin..."
            xcrun stapler staple "$plugin"
            rm "$zip_name"
          done
 
      - name: Determine build archive name
        run: |
          # If this is a tag, use the tag name. Otherwise, use a timestamp.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "ARCHIVE_NAME=open_mbc-${{ github.ref_name }}-${{ matrix.name }}" >> "$GITHUB_ENV"
          else
            echo "ARCHIVE_NAME=open_mbc-dev-${{ matrix.name }}" >> "$GITHUB_ENV"
          fi

      - name: Move all packaged plugin into a directory
        run: |
          mkdir -p "$ARCHIVE_NAME"
          mv target/bundled/* "$ARCHIVE_NAME/"
          cp ".github/workflows/readme-${{ runner.os }}.txt" "$ARCHIVE_NAME/README.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  # --- NEW: RELEASE JOB ---
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/') # Only run if we pushed a tag
    needs: package # Wait for all OS builds to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Zip artifacts for release
        run: |
          cd release-assets
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false